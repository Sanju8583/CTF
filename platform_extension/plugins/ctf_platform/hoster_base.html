{% extends "base.html" %}

{% block content %}
<main class="container py-4">
  <p><a href="{{ url_for('ctf_platform_hoster.dashboard') }}">Hoster workspace</a></p>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
  {% endfor %}
  {% block hoster_content %}{% endblock %}
</main>
{% endblock %}
